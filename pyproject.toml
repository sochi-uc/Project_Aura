[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-aura"
version = "0.2.0"
description = "A loosely coupled, self-hosted Telegram intelligence pipeline and knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Project Aura Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "telethon>=1.35.0",
    "python-telegram-bot>=21.0",
    "asyncpg>=0.29.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "bot*", "worker*", "digest*", "ingestion*", "scripts*"]
